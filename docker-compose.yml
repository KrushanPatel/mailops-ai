services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mailops-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailops

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mailops-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
